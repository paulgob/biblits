services:
    db:
        image: postgres:18
        environment:
            POSTGRES_DB: biblits_db
            POSTGRES_USER: biblits_user
            POSTGRES_PASSWORD: ${DB_PASSWORD} # read from .env
        volumes:
            - pgdata:/var/lib/postgresql # data survives container restarts
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U biblits_user -d biblits_db"]
            interval: 5s
            retries: 5
        restart: unless-stopped

    web:
        build: .
        env_file: .env
        environment:
            DJANGO_SETTINGS_MODULE: biblits.settings_prod
        command: >
            sh -c "python manage.py migrate &&
                   python manage.py collectstatic --noinput &&
                   gunicorn biblits.wsgi:application --bind 0.0.0.0:8000 --workers 3"
        volumes:
            - static:/app/staticfiles
        depends_on:
            db:
                condition: service_healthy # wait until postgres accepts connections
        restart: unless-stopped

    nginx:
        image: nginx:1.29-alpine
        ports:
            - "80:80" # only port open to the outside
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - static:/static:ro
        depends_on:
            - web
        restart: unless-stopped

volumes:
    pgdata:
    static:
