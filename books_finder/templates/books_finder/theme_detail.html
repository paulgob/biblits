{% extends "books_finder/base.html" %}
{% block title %}{{ theme.name }}{% endblock %}
{% block content %}
    <h1>{{ theme.name }}</h1>
    <h2>Voici les livres liés au thème</h2>
    <ul>
        {% for book in books %}
            <li><a href="{% url 'book_detail' pk=book.pk %}">{{ book.title }}</a></li>
        {% endfor %}
    </ul>
{% endblock %}
