upstream biblits_app {
    server web:8000; # docker compose service name + gunicorn port
}

server {
    listen 80;
    server_name _; # replace with the domain, e.g. biblits.fr www.biblits.fr
    client_max_body_size 10M;

    location /static/ {
        alias /static/; # volume shared with the web container
    }

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://biblits_app;
    }
}
